services:
  postgres:
    image: postgres:16
    container_name: prsentry-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: prsentry
      POSTGRES_PASSWORD: prsentry_dev_password
      POSTGRES_DB: prsentry
    ports:
      - "5433:5432"
    volumes:
      - prsentry_pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7
    container_name: prsentry-redis
    restart: unless-stopped
    ports:
      - "6379:6379"

volumes:
  prsentry_pgdata: